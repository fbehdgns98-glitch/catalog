<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>가을의 옷장</title>
<meta name="description" content="가을의 옷장 · STUDIO COLLECTION VOL. 01">
<script>
  // 접속 기기에 맞춰 PC/모바일 앨범으로 자동 이동
  // 강제 지정: ?v=pc 또는 ?v=mobile
  (function () {
    var q = new URLSearchParams(location.search).get('v');
    var mobile;
    if (q === 'pc') mobile = false;
    else if (q === 'mobile') mobile = true;
    else mobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) ||
                  (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent)) ||
                  window.matchMedia('(max-width: 820px)').matches;
    location.replace(mobile ? 'mobile.html' : 'pc.html');
  })();
</script>
<style>
  :root { --bg:#f4f1ea; --fg:#2b2b26; --accent:#353d2e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1d1f1a; --fg:#ecebe4; --accent:#8a9a76; } }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--bg); color:var(--fg); font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; }
  main { text-align:center; padding:16px; }
  h1 { font-weight:600; letter-spacing:.02em; }
  a { display:inline-block; margin:6px; padding:12px 22px; border-radius:8px; background:var(--accent); color:#fff; text-decoration:none; }
</style>
</head>
<body>
<main>
  <h1>가을의 옷장</h1>
  <p>앨범을 여는 중입니다…</p>
  <a href="pc.html">PC 버전</a>
  <a href="mobile.html">모바일 버전</a>
</main>
</body>
</html>
